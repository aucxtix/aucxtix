name: Generate Arcade Contribution Graphs

on:
  schedule: 
    - cron: '0 0 * * *' # Runs every 24 hours
  workflow_dispatch:    # Adds a button so you can run it manually
  push: 
    branches:
      - main            # Runs when you update your profile

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Contribution Graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
