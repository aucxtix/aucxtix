<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" font-family="'JetBrains Mono','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#58A6FF" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="228" rx="15" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="998" height="228" rx="15" fill="url(#grid)"/>

  <!-- Radar -->
  <g>
    <circle cx="115" cy="115" r="85" fill="none" stroke="#58A6FF" stroke-opacity="0.35"/>
    <circle cx="115" cy="115" r="57" fill="none" stroke="#58A6FF" stroke-opacity="0.3"/>
    <circle cx="115" cy="115" r="28" fill="none" stroke="#58A6FF" stroke-opacity="0.3"/>
    <line x1="30" y1="115" x2="200" y2="115" stroke="#58A6FF" stroke-opacity="0.25"/>
    <line x1="115" y1="30" x2="115" y2="200" stroke="#58A6FF" stroke-opacity="0.25"/>
    <g>
      <path d="M115 115 L55 55 A85 85 0 0 1 115 30 Z" fill="url(#sweep)"/>
      <line x1="115" y1="115" x2="115" y2="30" stroke="#58A6FF" stroke-width="2" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 115 115" to="360 115 115" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="115" cy="115" r="3" fill="#58A6FF"/>
    <g fill="#7C3AED">
      <circle cx="160" cy="70" r="3"><animate attributeName="r" values="2;7;2" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="150" r="3"><animate attributeName="r" values="2;7;2" dur="2s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.1;1" dur="2s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="160" r="3"><animate attributeName="r" values="2;7;2" dur="2s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.1;1" dur="2s" begin="1.3s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- Header -->
  <text x="250" y="38" fill="#58A6FF" font-size="14" font-weight="700" letter-spacing="3">ACTIVITY // LIVE FEED</text>
  <circle cx="232" cy="33" r="4" fill="#2ea44f"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>

  <!-- Terminal lines -->
  <g font-size="15" fill="#c9d1d9">
    <text x="250" y="72"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="9s" begin="0s" repeatCount="indefinite"/><tspan fill="#2ea44f">[+]</tspan> scanning ........ <tspan fill="#58A6FF">Python / Django / Flask</tspan></text>
    <text x="250" y="97"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="9s" begin="1s" repeatCount="indefinite"/><tspan fill="#2ea44f">[+]</tspan> hackathons ..... <tspan fill="#58A6FF">2x finalist</tspan></text>
    <text x="250" y="122"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="9s" begin="2s" repeatCount="indefinite"/><tspan fill="#2ea44f">[+]</tspan> open source ..... <tspan fill="#58A6FF">GSSoC &amp; Nexus</tspan></text>
    <text x="250" y="147"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="9s" begin="3s" repeatCount="indefinite"/><tspan fill="#2ea44f">[+]</tspan> status .......... <tspan fill="#2ea44f">open to work</tspan></text>
    <rect x="460" y="134" width="9" height="16" fill="#58A6FF"><animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ECG pulse -->
  <path id="ecg" pathLength="1000" fill="none" stroke="#58A6FF" stroke-opacity="0.18" stroke-width="2" stroke-linejoin="round"
    d="M250 195 H320 L335 195 L345 172 L357 214 L370 148 L382 195 H480 L495 195 L505 172 L517 214 L530 148 L542 195 H640 L655 195 L665 172 L677 214 L690 148 L702 195 H800 L815 195 L825 172 L837 214 L850 148 L862 195 H975"/>
  <path pathLength="1000" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140 860" filter="url(#glow)"
    d="M250 195 H320 L335 195 L345 172 L357 214 L370 148 L382 195 H480 L495 195 L505 172 L517 214 L530 148 L542 195 H640 L655 195 L665 172 L677 214 L690 148 L702 195 H800 L815 195 L825 172 L837 214 L850 148 L862 195 H975">
    <animate attributeName="stroke-dashoffset" from="140" to="-1000" dur="3.5s" repeatCount="indefinite"/>
  </path>
</svg>
